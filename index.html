<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐣 우리들의 놀이터 & 작업실</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ffb3c6; --pink-d:#ff8fab;
    --yellow:#ffe5a0; --yellow-d:#ffc94d;
    --mint:#b8f2e6; --mint-d:#5ed1b8;
    --sky:#bde0fe; --sky-d:#7cb8f5;
    --lav:#d8c8ff; --lav-d:#a58bff;
    --text:#5a4a5e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Gaegu','Jua',sans-serif;
    color:var(--text);
    min-height:100vh;
    background:#fff7fb;
    background-image:
      radial-gradient(#ffd6e3 1.5px, transparent 1.5px),
      radial-gradient(#d6ecff 1.5px, transparent 1.5px);
    background-size:28px 28px;
    background-position:0 0,14px 14px;
    padding:40px 18px 60px;
    overflow-x:hidden;
  }
  /* 떠다니는 장식 */
  .float{position:fixed;font-size:2rem;opacity:.55;pointer-events:none;animation:drift 9s ease-in-out infinite}
  .f1{top:8%;left:6%}
  .f2{top:20%;right:8%;animation-delay:-2s}
  .f3{bottom:12%;left:10%;animation-delay:-4s}
  .f4{bottom:20%;right:6%;animation-delay:-6s}
  .f5{top:55%;left:3%;animation-delay:-3s}
  @keyframes drift{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(6deg)}}

  .wrap{max-width:860px;margin:0 auto;position:relative;z-index:1}

  header{text-align:center;margin-bottom:38px}
  .mascot{font-size:4.2rem;display:inline-block;animation:bounce 1.6s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  h1{
    font-family:'Jua',sans-serif;
    font-size:clamp(2rem,6vw,3rem);
    color:#ff6f91;
    text-shadow:3px 3px 0 #fff, 5px 5px 0 #ffd6e3;
    margin-top:6px;
  }
  .sub{font-size:1.35rem;margin-top:8px}

  section{
    background:#fff;
    border:3px solid var(--sec-d);
    border-radius:28px;
    padding:26px 22px 28px;
    margin-bottom:34px;
    box-shadow:0 8px 0 var(--sec-d);
    position:relative;
  }
  section.fun{--sec:var(--pink);--sec-d:var(--pink-d)}
  section.work{--sec:var(--sky);--sec-d:var(--sky-d)}

  .tag{
    position:absolute;top:-22px;left:24px;
    background:var(--sec);
    border:3px solid var(--sec-d);
    border-radius:999px;
    padding:4px 20px;
    font-family:'Jua',sans-serif;
    font-size:1.4rem;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:18px;
    margin-top:14px;
  }

  .card{
    --c:var(--yellow);--cd:var(--yellow-d);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-decoration:none;color:var(--text);
    background:var(--c);
    border:3px solid var(--cd);
    border-radius:22px;
    padding:22px 12px 18px;
    box-shadow:0 6px 0 var(--cd);
    transition:transform .15s, box-shadow .15s;
    text-align:center;
  }
  .card:hover{transform:translateY(-4px) rotate(-1.5deg);box-shadow:0 10px 0 var(--cd)}
  .card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cd)}
  .card .ico{font-size:3rem;margin-bottom:8px;transition:transform .3s}
  .card:hover .ico{transform:scale(1.15) rotate(8deg)}
  .card .name{font-family:'Jua',sans-serif;font-size:1.35rem}
  .card .desc{font-size:1.05rem;margin-top:4px;opacity:.85}

  .c-yellow{--c:var(--yellow);--cd:var(--yellow-d)}
  .c-mint{--c:var(--mint);--cd:var(--mint-d)}
  .c-lav{--c:var(--lav);--cd:var(--lav-d)}
  .c-pink{--c:var(--pink);--cd:var(--pink-d)}
  .c-sky{--c:var(--sky);--cd:var(--sky-d)}

  .ext{font-size:.85rem;opacity:.7;margin-top:2px}

  footer{text-align:center;font-size:1.15rem;opacity:.8}
</style>
</head>
<body>
  <span class="float f1">🌸</span>
  <span class="float f2">⭐</span>
  <span class="float f3">🍀</span>
  <span class="float f4">🎈</span>
  <span class="float f5">☁️</span>

  <div class="wrap">
    <header>
      <div class="mascot">🐣</div>
      <h1>우리들의 놀이터 & 작업실</h1>
      <p class="sub">원하는 기능을 콕! 눌러보세요 ♡</p>
    </header>

    <section class="fun">
      <div class="tag">🎮 재미</div>
      <div class="grid">
        <a class="card c-yellow" href="사다리타기.html">
          <div class="ico">🪜</div>
          <div class="name">사다리타기</div>
          <div class="desc">두근두근 운명의 사다리</div>
        </a>
        <a class="card c-mint" href="룰렛추첨기.html">
          <div class="ico">🎡</div>
          <div class="name">룰렛추첨기</div>
          <div class="desc">빙글빙글 돌려돌려~</div>
        </a>
        <a class="card c-lav" href="제비뽑기.html">
          <div class="ico">🎟️</div>
          <div class="name">제비뽑기</div>
          <div class="desc">하나만 골라봐!</div>
        </a>
        <a class="card c-pink" href="https://script.google.com/macros/s/AKfycbycUx8NXTfDsDYptLAZijA-71XIMoORy49DH7Af1y87YMEHLzbfwIJqbSmF7U3ihFw3zw/exec" target="_blank" rel="noopener">
          <div class="ico">🍱</div>
          <div class="name">날씨기반 점심고르기</div>
          <div class="desc">오늘 날씨엔 뭐 먹지?</div>
          <div class="ext">↗ 새 창에서 열려요</div>
        </a>
      </div>
    </section>

    <section class="work">
      <div class="tag">💼 업무</div>
      <div class="grid">
        <a class="card c-sky" href="PDF병합도구.html">
          <div class="ico">📎</div>
          <div class="name">PDF 병합도구</div>
          <div class="desc">여러 PDF를 하나로 쏙!</div>
        </a>
      </div>
    </section>

    <footer>Made with 💖 · 오늘도 화이팅!</footer>
  </div>
</body>
</html>
